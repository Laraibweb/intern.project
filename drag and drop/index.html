<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drag & Drop File Uploader</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📁 Drag & Drop File Uploader</h1>
        
        <!-- Drop Area -->
        <div class="drop-area" id="dropArea">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p class="drop-text">Drag and drop your images here or <span class="click-text">click to select</span></p>
            <p class="file-info">Supported formats: JPG, PNG, GIF (Max 5MB)</p>
            <input type="file" id="fileInput" accept="image/jpeg,image/png,image/gif" multiple hidden>
        </div>

        <!-- Error Message -->
        <div class="error-message" id="errorMessage"></div>

        <!-- Gallery Section -->
        <div class="gallery-section">
            <h2>📸 Uploaded Images</h2>
            <div class="gallery" id="gallery"></div>
            <button class="clear-btn" id="clearBtn" style="display: none;">🗑️ Clear All</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
